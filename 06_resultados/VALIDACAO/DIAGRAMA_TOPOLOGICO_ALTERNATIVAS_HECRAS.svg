<text x="65" y="132" font-size="21px" fill="#17324d" font-weight="700" text-anchor="start">A. Rede física esquemática</text>
<text x="65" y="160" font-size="14px" fill="#52606d" font-weight="400" text-anchor="start">Os eixos E02/E04 são os ramos prioritários; E08 e E12 entram como extensões condicionadas.</text>
