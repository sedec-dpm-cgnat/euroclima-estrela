<text x="1397.5" y="837" font-size="14px" fill="#805ad5" font-weight="700" text-anchor="middle">carteira + Forqueta</text>
<text x="1397.5" y="861" font-size="12px" fill="#52606d" font-weight="400" text-anchor="middle">sensibilidade lateral</text>
<line x1="1510" y1="830.0" x2="1540" y2="830.0" stroke="#8a959e" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="1535" y="755" width="215" height="150" rx="10" fill="#f1f3f5" stroke="#6c757d" stroke-width="2"/><text x="1642.5" y="780" text-anchor="middle" font-size="18" font-weight="700" fill="#203040">HEC-06</text><text x="1642.5" y="802" text-anchor="middle" font-size="12" fill="#203040">C04 / C05 / FQ1</text></g>
<text x="1642.5" y="837" font-size="14px" fill="#6c757d" font-weight="700" text-anchor="middle">rede crítica</text>
<text x="1642.5" y="861" font-size="12px" fill="#52606d" font-weight="400" text-anchor="middle">sensibilidade opcional</text>
<rect x="65" y="950" width="1690" height="80" rx="8" fill="#fff8e1" stroke="#d69e2e"/>
<text x="85" y="978" font-size="14px" fill="#8a5a00" font-weight="700" text-anchor="start">Regra de decisão</text>
<text x="85" y="1003" font-size="13px" fill="#5d4700" font-weight="400" text-anchor="start">HEC-01 é o primeiro caso com obra. HEC-02 e HEC-03 medem o ganho incremental. GU1 entra como extensão prioritária após a calibração; FQ2 e FQ1 são sensibilidades laterais exclusivas. Nenhum cenário é obra selecionada antes da curva cota–dano e da validação hidráulica.</text>
<text x="65" y="1092" font-size="12px" fill="#6c757d" font-weight="400" text-anchor="start">Fonte: síntese da topologia E01–E12 e da matriz de alternativas do estudo EUROCLIMA+ / AECID. Esquema sem escala.</text>
</svg>