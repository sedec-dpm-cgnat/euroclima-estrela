<text x="662.5" y="837" font-size="14px" fill="#b7791f" font-weight="700" text-anchor="middle">E02 + E04 + E08</text>
<text x="662.5" y="861" font-size="12px" fill="#52606d" font-weight="400" text-anchor="middle">cobertura intermediária</text>
<line x1="775" y1="830.0" x2="805" y2="830.0" stroke="#8a959e" stroke-width="2" marker-end="url(#arrow)"/>
