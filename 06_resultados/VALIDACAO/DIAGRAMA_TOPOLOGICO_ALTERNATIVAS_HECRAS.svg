<g><rect x="760" y="115" width="180" height="55" rx="10" fill="#e7f7ed" stroke="#2f855a" stroke-width="2"/><text x="850.0" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#203040">GU1</text><text x="850.0" y="162" text-anchor="middle" font-size="12" fill="#203040">Guaporé · prioridade</text></g>
<text x="950" y="146" font-size="13px" fill="#2f855a" font-weight="700" text-anchor="start">entrada lateral a montante</text>
<text x="950" y="164" font-size="12px" fill="#2f855a" font-weight="400" text-anchor="start">com desagregação do hidrograma</text>
<line x1="1215" y1="475" x2="1215" y2="325" stroke="#805ad5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<g><rect x="1115" y="475" width="200" height="55" rx="10" fill="#f0eafd" stroke="#805ad5" stroke-width="2"/><text x="1215.0" y="500" text-anchor="middle" font-size="18" font-weight="700" fill="#203040">FQ2</text><text x="1215.0" y="522" text-anchor="middle" font-size="12" fill="#203040">Forqueta · sensibilidade</text></g>
<text x="1335" y="498" font-size="13px" fill="#805ad5" font-weight="700" text-anchor="start">entrada lateral antes de Estrela</text>
<text x="1335" y="516" font-size="12px" fill="#805ad5" font-weight="400" text-anchor="start">FQ1 é alternativa exclusiva e condicionada</text>
<rect x="65" y="540" width="15" height="15" fill="#e6f2ff" stroke="#1d70b8"/>
<text x="88" y="553" font-size="12px" fill="#263238" font-weight="400" text-anchor="start">prioritário</text>
<rect x="180" y="540" width="15" height="15" fill="#fff4d6" stroke="#b7791f"/>
<text x="203" y="553" font-size="12px" fill="#263238" font-weight="400" text-anchor="start">extensão intermediária</text>
<rect x="375" y="540" width="15" height="15" fill="#fde8e8" stroke="#c53030"/>
<text x="398" y="553" font-size="12px" fill="#263238" font-weight="400" text-anchor="start">cobertura terminal</text>
<line x1="600" y1="548" x2="665" y2="548" stroke="#805ad5" stroke-width="3" stroke-dasharray="8 6"/>
<text x="678" y="553" font-size="12px" fill="#263238" font-weight="400" text-anchor="start">ramo lateral / sensibilidade</text>
<text x="65" y="585" font-size="13px" fill="#52606d" font-weight="400" text-anchor="start">A topologia não autoriza, por si só, a combinação de obras: remanso, cota de afogamento, energia e operação ainda precisam ser validados.</text>
<rect x="35" y="635" width="1730" height="430" rx="14" fill="#f7f9fb" stroke="#d7e0e8"/>
<text x="65" y="670" font-size="21px" fill="#17324d" font-weight="700" text-anchor="start">B. Sequência de simulação no HEC-RAS 1D</text>
<text x="65" y="697" font-size="14px" fill="#52606d" font-weight="400" text-anchor="start">A primeira rodada identifica o efeito incremental; as extensões só entram depois da calibração do caso sem obra.</text>
<g><rect x="65" y="755" width="215" height="150" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="172.5" y="780" text-anchor="middle" font-size="18" font-weight="700" fill="#203040">HEC-00</text><text x="172.5" y="802" text-anchor="middle" font-size="12" fill="#203040">REF</text></g>
<text x="172.5" y="837" font-size="14px" fill="#495057" font-weight="700" text-anchor="middle">sem obra</text>
<text x="172.5" y="861" font-size="12px" fill="#52606d" font-weight="400" text-anchor="middle">calibração do evento 2024</text>
